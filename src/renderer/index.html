<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>unvisible</title>
  <script>document.documentElement.dataset.theme = 'dark'</script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <header class="bar" id="bar">
      <div class="brand">
        <span class="dot"></span>
        <span class="name">unvisible</span>
      </div>
      <div class="bar-actions">
        <button class="icon-btn" id="btn-request" title="仅请求模型">
          <svg viewBox="0 0 24 24"><path d="M4 12h16M13 5l7 7-7 7"/></svg>
        </button>
        <button class="icon-btn" id="btn-shot" title="截图并请求">
          <svg viewBox="0 0 24 24"><path d="M3 8h4l2-3h6l2 3h4v12H3z"/><circle cx="12" cy="13" r="3.5"/></svg>
        </button>
        <button class="icon-btn" id="btn-settings" title="设置">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1"/></svg>
        </button>
      </div>
    </header>

    <main class="body">
      <div class="status" id="status">
        <span class="status-text" id="status-text">等待指令</span>
        <span class="spinner" id="spinner" hidden></span>
      </div>
      <div class="output" id="output">
        <div class="empty" id="empty">
          <p class="empty-title">屏幕内容不会被记录</p>
          <p class="empty-sub">截图只在请求时发生，结果直接显示在这里</p>
        </div>
        <article class="content" id="content"></article>
      </div>
    </main>

    <footer class="foot">
      <span class="prompt-tag" id="prompt-tag">通用解读</span>
      <span class="hint" id="hint">⌘H 截图并提问</span>
    </footer>
  </div>
  <script src="marked.min.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
